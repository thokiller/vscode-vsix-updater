name: Validate Extension

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-updater
          path: '*.vsix'
          if-no-files-found: error
